<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Test Platform - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .forgot-link {
            text-align: right;
            margin-bottom: 20px;
        }
        
        .forgot-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
            cursor: pointer;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .hidden {
            display: none;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
        }
        
        .modal-content h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .loader {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Mock Test Platform</h1>
            <p>Practice, Learn, Succeed</p>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Login</div>
            <div class="tab" onclick="switchTab('register')">Register</div>
        </div>
        
        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>
            
            <div class="forgot-link">
                <a onclick="openForgotModal()">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn">Login</button>
        </form>
        
        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="Enter full name" required>
            </div>
            
            <div class="form-group">
                <label>Username (Unique)</label>
                <input type="text" id="regUsername" placeholder="Choose username" required>
            </div>
            
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="tel" id="regMobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Minimum 6 characters" minlength="6" required>
            </div>
            
            <button type="submit" class="btn">Register</button>
        </form>
        
        <div id="message" class="message"></div>
        <div class="loader hidden" id="loader">
            <div class="spinner"></div>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <h2>🔑 Forgot Password</h2>
            <div class="form-group">
                <label>Enter Username or Mobile Number</label>
                <input type="text" id="forgotInput" placeholder="Username or mobile" required>
            </div>
            <button class="btn" onclick="forgotPassword()">Recover Password</button>
            <button class="btn" style="background: #6c757d; margin-top: 10px;" onclick="closeForgotModal()">Cancel</button>
            <div id="forgotMessage" class="message" style="margin-top: 15px;"></div>
        </div>
    </div>

    <script>
        // Configuration
        const API_URL = 'https://script.google.com/macros/s/AKfycbyvMjjZW8VhupLm7fawJzviuT2MX3jABP3glXICcedRQlw-387mauydpFJtOXIel7rOWA/exec'; // Replace with your deployed URL
        
        // Tab Switching
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.tab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const message = document.getElementById('message');
            
            tabs.forEach(t => t.classList.remove('active'));
            message.className = 'message';
            
            if (tab === 'login') {
                tabs[0].classList.add('active');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                tabs[1].classList.add('active');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }
        
        // Show loader
        function showLoader() {
            document.getElementById('loader').classList.remove('hidden');
        }
        
        function hideLoader() {
            document.getElementById('loader').classList.add('hidden');
        }
        
        // Show message
        function showMessage(type, text) {
            const message = document.getElementById('message');
            message.className = `message ${type}`;
            message.textContent = text;
            setTimeout(() => {
                message.className = 'message';
            }, 5000);
        }
        
        // Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) {
                showMessage('error', 'Please fill all fields');
                return;
            }
            
            showLoader();
            
            try {
                const response = await fetch(`${API_URL}?action=login&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`);
                const data = await response.json();
                
                if (data.success) {
                    // Store user session
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMessage('success', 'Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    showMessage('error', data.error || 'Login failed');
                }
            } catch (error) {
                showMessage('error', 'Connection error. Please try again.');
            } finally {
                hideLoader();
            }
        });
        
        // Register Form Submit
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const mobile = document.getElementById('regMobile').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (!name || !username || !mobile || !password) {
                showMessage('error', 'Please fill all fields');
                return;
            }
            
            if (mobile.length !== 10 || !/^\d+$/.test(mobile)) {
                showMessage('error', 'Please enter valid 10-digit mobile number');
                return;
            }
            
            if (password.length < 6) {
                showMessage('error', 'Password must be at least 6 characters');
                return;
            }
            
            showLoader();
            
            try {
                const response = await fetch(`${API_URL}?action=register&name=${encodeURIComponent(name)}&username=${encodeURIComponent(username)}&mobile=${encodeURIComponent(mobile)}&password=${encodeURIComponent(password)}`);
                const data = await response.json();
                
                if (data.success) {
                    showMessage('success', 'Registration successful! Please login.');
                    switchTab('login');
                    document.getElementById('loginUsername').value = username;
                } else {
                    showMessage('error', data.error || 'Registration failed');
                }
            } catch (error) {
                showMessage('error', 'Connection error. Please try again.');
            } finally {
                hideLoader();
            }
        });
        
        // Forgot Password Modal
        function openForgotModal() {
            document.getElementById('forgotModal').style.display = 'flex';
            document.getElementById('forgotMessage').className = 'message';
        }
        
        function closeForgotModal() {
            document.getElementById('forgotModal').style.display = 'none';
        }
        
        async function forgotPassword() {
            const input = document.getElementById('forgotInput').value.trim();
            const forgotMessage = document.getElementById('forgotMessage');
            
            if (!input) {
                forgotMessage.className = 'message error';
                forgotMessage.textContent = 'Please enter username or mobile';
                return;
            }
            
            showLoader();
            
            try {
                const response = await fetch(`${API_URL}?action=forgotPassword&input=${encodeURIComponent(input)}`);
                const data = await response.json();
                
                if (data.success) {
                    forgotMessage.className = 'message success';
                    forgotMessage.textContent = `Your password: ${data.password}`;
                } else {
                    forgotMessage.className = 'message error';
                    forgotMessage.textContent = data.error || 'Account not found';
                }
            } catch (error) {
                forgotMessage.className = 'message error';
                forgotMessage.textContent = 'Connection error';
            } finally {
                hideLoader();
            }
        }
        
        // Check if already logged in
        if (localStorage.getItem('user')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
