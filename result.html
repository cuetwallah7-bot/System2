<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result - Mock Test Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .result-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .test-code {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 30px;
            font-size: 16px;
        }
        
        .score-display {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .score-number {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .score-label {
            color: #666;
            font-size: 14px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat-box h3 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .stat-box p {
            color: #666;
            font-size: 13px;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .leaderboard {
            margin-top: 30px;
            text-align: left;
        }
        
        .leaderboard h3 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #f8f9fa;
            margin-bottom: 5px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .leaderboard-item .rank {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="result-card">
        <div class="result-icon" id="resultEmoji">🎉</div>
        <h1>Test Completed!</h1>
        <p class="test-code" id="testCodeDisplay"></p>
        
        <div class="score-display">
            <div class="score-number" id="scoreDisplay">0/0</div>
            <div class="score-label">Your Score</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-box">
                <h3 id="accuracyDisplay">0%</h3>
                <p>Accuracy</p>
            </div>
            <div class="stat-box">
                <h3 id="timeDisplay">--</h3>
                <p>Date</p>
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">
                Back to Dashboard
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">
                Try More Tests
            </button>
        </div>
        
        <div class="leaderboard" id="leaderboardSection">
            <h3>🏆 Leaderboard</h3>
            <div id="leaderboardList">Loading...</div>
        </div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyvMjjZW8VhupLm7fawJzviuT2MX3jABP3glXICcedRQlw-387mauydpFJtOXIel7rOWA/exec'; // Replace with your deployed URL
        
        const urlParams = new URLSearchParams(window.location.search);
        const score = urlParams.get('score');
        const total = urlParams.get('total');
        const accuracy = urlParams.get('accuracy');
        const testCode = urlParams.get('testCode');
        
        document.getElementById('testCodeDisplay').textContent = `Test Code: ${testCode}`;
        document.getElementById('scoreDisplay').textContent = `${score}/${total}`;
        document.getElementById('accuracyDisplay').textContent = `${accuracy}%`;
        document.getElementById('timeDisplay').textContent = new Date().toLocaleDateString();
        
        // Update emoji based on performance
        const percentage = (score / total) * 100;
        const emoji = document.getElementById('resultEmoji');
        if (percentage >= 90) emoji.textContent = '🏆';
        else if (percentage >= 70) emoji.textContent = '🎉';
        else if (percentage >= 50) emoji.textContent = '👍';
        else emoji.textContent = '📚';
        
        // Load leaderboard
        async function loadLeaderboard() {
            try {
                const response = await fetch(`${API_URL}?action=getLeaderboard&testCode=${encodeURIComponent(testCode)}`);
                const data = await response.json();
                
                if (data.success && data.leaderboard.length > 0) {
                    const list = document.getElementById('leaderboardList');
                    list.innerHTML = data.leaderboard.slice(0, 10).map(item => `
                        <div class="leaderboard-item">
                            <span class="rank">#${item.rank}</span>
                            <span>${item.name}</span>
                            <span>${item.score} | ${item.accuracy}%</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('leaderboardSection').style.display = 'none';
                }
            } catch (error) {
                document.getElementById('leaderboardList').textContent = 'Unable to load leaderboard';
            }
        }
        
        loadLeaderboard();
    </script>
</body>
</html>
